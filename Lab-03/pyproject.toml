[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab03-dora"
version = "0.1.0"
description = "Coletores e métricas reprodutíveis do Laboratório 03"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
lab03 = "lab03.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=lab03.metrics --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["lab03.metrics"]

