[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab01"
version = "0.1.0"
description = "Pacotes compartilhados do Lab01 - Laboratório de Experimentação de Software"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["src*"]
